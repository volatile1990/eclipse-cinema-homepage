<svg xmlns="http://www.w3.org/2000/svg" width="240mm" height="95mm" viewBox="0 0 240 95" role="img" aria-labelledby="title desc">
  <title id="title">ECLIPSE HOMECINEMA aluminium door plate preview</title>
  <desc id="desc">Preview of the homepage-matched eclipse engraving logo on brushed aluminium.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f4f2" />
      <stop offset="0.28" stop-color="#c8ccca" />
      <stop offset="0.62" stop-color="#edf0ee" />
      <stop offset="1" stop-color="#a9afae" />
    </linearGradient>
    <pattern id="brushed" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 1H5M0 3H5" stroke="#ffffff" stroke-width="0.22" opacity="0.48" />
      <path d="M0 2H5M0 4H5" stroke="#6e7778" stroke-width="0.16" opacity="0.24" />
    </pattern>
    <filter id="engrave-shadow" x="-8%" y="-12%" width="116%" height="124%">
      <feDropShadow dx="0" dy="0.55" stdDeviation="0.35" flood-color="#ffffff" flood-opacity="0.52" />
      <feDropShadow dx="0" dy="-0.42" stdDeviation="0.32" flood-color="#121617" flood-opacity="0.32" />
    </filter>
  </defs>

  <rect x="1" y="1" width="238" height="93" rx="4" fill="url(#plate)" />
  <rect x="1" y="1" width="238" height="93" rx="4" fill="url(#brushed)" opacity="0.76" />
  <rect x="2" y="2" width="236" height="91" rx="3.5" fill="none" stroke="#737c7d" stroke-width="0.7" opacity="0.45" />

  <g id="engraving" fill="#171b1c" stroke="#171b1c" stroke-linecap="round" stroke-linejoin="round" filter="url(#engrave-shadow)">
    <g id="brand-mark" transform="translate(29 24)">
      <rect x="0" y="0" width="47" height="47" rx="8.8" fill="none" stroke-width="3.2" />
      <path
        d="M11.573 5.931A11 11 0 1 0 24.427 23.069A11 11 0 0 1 11.573 5.931Z"
        transform="scale(1.46875)"
        stroke="none"
      />
    </g>

    <g id="wordmark">
      <text
        x="88"
        y="48.5"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="24"
        font-weight="760"
        letter-spacing="1.8"
      >ECLIPSE</text>
      <path d="M89 57H211" fill="none" stroke-width="1.35" />
      <text
        x="89"
        y="70.5"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="7"
        font-weight="720"
        letter-spacing="4.1"
      >HOMECINEMA</text>
    </g>
  </g>
</svg>
