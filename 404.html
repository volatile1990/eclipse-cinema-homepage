    <link rel="icon" href="/assets/used/eclipse-favicon-32.png" />
    <script>
      (() => {
        const isPortalRoute =
          location.pathname === "/portal" || location.pathname.startsWith("/portal/");
        document.documentElement.className = isPortalRoute
          ? "portal-route"
          : "not-found-route";
        window.__ECLIPSE_PORTAL_ROUTE__ = isPortalRoute;

        if (isPortalRoute) {
          document.title = "Eclipse Cinema Portal";
          const manifest = document.createElement("link");
          manifest.rel = "manifest";
          manifest.href = "/portal/manifest.webmanifest";
          document.head.append(manifest);
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #05070b;
        color: #f2f2f5;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      .portal-route,
      .portal-route body {
        height: 100%;
      }

      .portal-route body {
        overflow: hidden;
      }

      .portal-route #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      .portal-route .not-found,
      .not-found-route #root {
        display: none;
      }

      .not-found-route body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 20% 15%, rgba(232, 176, 75, 0.16), transparent 26rem),
          radial-gradient(circle at 80% 85%, rgba(94, 94, 170, 0.12), transparent 30rem),
          #05070b;
      }

      .not-found {
        width: min(100% - 2rem, 58rem);
        padding: clamp(2rem, 8vw, 5.5rem);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.5rem;
        background: linear-gradient(145deg, rgba(28, 28, 36, 0.96), rgba(12, 12, 18, 0.94));
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.42);
      }

      .not-found img {
        width: min(13rem, 62vw);
        height: auto;
      }

      .not-found-kicker {
        margin: 2rem 0 0.7rem;
        color: #e8b04b;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .not-found h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(2.4rem, 9vw, 5.5rem);
        line-height: 0.98;
        letter-spacing: -0.045em;
      }

      .not-found p:not(.not-found-kicker) {
        max-width: 38rem;
        margin: 1.4rem 0 0;
        color: rgba(242, 242, 245, 0.72);
        font-size: 1.05rem;
        line-height: 1.65;
      }

      .not-found-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      .not-found a {
        min-height: 3rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.1rem;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 0.8rem;
        color: #f2f2f5;
        font-weight: 750;
        text-decoration: none;
      }

      .not-found a:first-child {
        border-color: #e8b04b;
        background: #e8b04b;
        color: #09090d;
      }

      .not-found a:focus-visible {
        outline: 3px solid rgba(232, 176, 75, 0.7);
        outline-offset: 3px;
      }

      noscript {
        display: block;
        padding: 1rem;
      }

      <p>
        Die angeforderte Adresse existiert nicht oder wurde verschoben. Über die

      <div class="not-found-actions">
        <a href="/">Zur Homepage</a>

    <noscript>

      <a href="/">eclipse-homecinema.de</a> erreichbar.
    </noscript>
    <div id="root"></div>

    <script>
      if (window.__ECLIPSE_PORTAL_ROUTE__) {
        const script = document.createElement("script");
        script.src = "/portal/_expo/static/js/web/entry-955077e13ba06251efb8cfd1588ebb3c.js";
        script.defer = true;
        document.body.append(script);
